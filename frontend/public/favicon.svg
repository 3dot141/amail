<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">MailFlow — Flow Mail Refined</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#8372f7"/>
      <stop offset="0.5" stop-color="#7c6af7"/>
      <stop offset="1" stop-color="#7564e9"/>
    </linearGradient>
    <filter id="envelope-shadow" x="-20%" y="-25%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset in="blur" dy="7" result="offset"/>
      <feFlood flood-color="#0f0f11" flood-opacity="0.16" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#background)"/>
  <path filter="url(#envelope-shadow)" fill="#ffffff" d="M174 177 H377 Q392 177 392 192 V320 Q392 335 377 335 H174 Q159 335 159 320 V192 Q159 177 174 177 Z"/>
  <path fill="none" stroke="#7c6af7" stroke-width="18" stroke-linejoin="round" d="M165 188 L275 257 L386 188"/>
  <path fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" d="M116 211 H139 M104 256 H139 M116 301 H139"/>
</svg>
